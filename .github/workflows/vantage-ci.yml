name: Vantage static site checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vantage-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.check }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        check: [tests, source]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.check == 'source'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: matrix.check == 'tests'
        with:
          python-version: '3.12'
      - name: Static site regression tests
        if: matrix.check == 'tests'
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        if: matrix.check == 'source'
        run: node --check app.js
